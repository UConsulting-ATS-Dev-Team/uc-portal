<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- No background rect -- transparent, matching how uconsultingla.com's
       own favicon renders (confirmed by sampling its PNG: alpha 0 at both
       the corner and center, no fill baked in at all). The earlier white
       rect showed as a visible box against Chrome's tab-strip background
       whenever that isn't pure white (dark mode, some themes). -->
  <text x="16" y="23" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="19">
    <tspan fill="#0c74c1">U</tspan><tspan fill="#042742">C</tspan>
  </text>
</svg>
